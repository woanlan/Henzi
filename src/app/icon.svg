<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#amberGrad)" stroke="#FDE68A" stroke-width="3" stroke-opacity="0.6" filter="url(#badgeShadow)" />
  <!-- Authentic Hanzi Character '汉' -->
  <text x="64" y="88" font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="74" font-weight="900" fill="#FFFFFF" text-anchor="middle">汉</text>
</svg>