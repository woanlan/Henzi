<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- BACKGROUND: Subtle Paper Texture / Card -->
  <rect width="640" height="220" rx="16" fill="#FAFAF9" />
  <rect x="1.5" y="1.5" width="637" height="217" rx="14.5" fill="none" stroke="#E7E5E4" stroke-width="1.5" />

  <!-- LOGO MARK: HANZI WITH CALLIGRAPHY BRUSH 'I' -->
  <g id="wordmark" fill="#1C1917" filter="url(#softGlow)">
    <!-- LETTER H -->
    <path d="M 60,55 L 78,55 L 78,86 L 114,86 L 114,55 L 132,55 L 132,135 L 114,135 L 114,104 L 78,104 L 78,135 L 60,135 Z" />

    <!-- LETTER A -->
    <path d="M 194,55 L 208,55 L 244,135 L 224,135 L 216,116 L 186,116 L 178,135 L 158,135 Z M 193,76 L 183,101 L 219,101 Z" />

    <!-- LETTER N -->
    <path d="M 264,55 L 282,55 L 322,113 L 322,55 L 340,55 L 340,135 L 322,135 L 282,77 L 282,135 L 264,135 Z" />

    <!-- LETTER Z -->
    <path d="M 362,55 L 434,55 L 434,72 L 388,118 L 434,118 L 434,135 L 362,135 L 362,118 L 408,72 L 362,72 Z" />

    <!-- LETTER I : CLEVER CHINESE CALLIGRAPHY INK BRUSH -->
    <!-- Bamboo / Wood Handle -->
    <path d="M 466,45 L 480,45 L 479,94 L 467,94 Z" fill="#1C1917" />
    <!-- Bamboo Node Accent Ring -->
    <line x1="466" y1="68" x2="480" y2="68" stroke="#FAFAF9" stroke-width="1.5" />
    
    <!-- Gold Ferrule (Khuyên giữ cọ màu vàng hổ phách) -->
    <rect x="465" y="94" width="16" height="5" rx="1.5" fill="url(#amberGold)" />

    <!-- Calligraphy Brush Hair Tip (Ngọn lông cọ vuốt nhọn nghệ thuật) -->
    <path d="M 465,99 C 463,112 468,128 473,142 C 478,128 483,112 481,99 Z" fill="#1C1917" />

    <!-- Ink Droplet (Giọt mực son vàng hổ phách rơi tinh tế) -->
    <path d="M 473,150 C 468,157 467,161 467,164 C 467,167.5 469.7,170 473,170 C 476.3,170 479,167.5 479,164 C 479,161 478,157 473,150 Z" fill="url(#amberGold)" />
  </g>

  <!-- SUBTITLE & SLOGAN -->
  <text x="60" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="4.5" fill="#78716C">
    ACADEMY OF CHINESE LANGUAGE
  </text>
  <rect x="420" y="177" width="4" height="4" rx="1" fill="#D97706" />
  <text x="432" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D97706">
    HSK 3.0
  </text>
</svg>
