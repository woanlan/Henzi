<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- BACKGROUND: Subtle Paper Texture / Card -->
  <rect width="640" height="220" rx="16" fill="#FAFAF9" />
  <rect x="1.5" y="1.5" width="637" height="217" rx="14.5" fill="none" stroke="#E7E5E4" stroke-width="1.5" />

  <!-- LOGO MARK: HANZI WITH OPEN WISDOM BOOK 'H' -->
  <g id="wordmark" fill="#1C1917" filter="url(#softGlow4)">
    <!-- LETTER H : STAGING THE OPEN BOOK AS CROSSBAR -->
    <!-- Left Pillar -->
    <path d="M 60,55 L 78,55 L 78,135 L 60,135 Z" />
    <!-- Right Pillar -->
    <path d="M 126,55 L 144,55 L 144,135 L 126,135 Z" />

    <!-- Open Book Pages (Trang sách tri thức mở rộng kết nối 2 cột) -->
    <!-- Left Page -->
    <path d="M 78,92 C 86,90 94,88 102,94 L 102,108 C 94,102 86,104 78,106 Z" fill="url(#amberGold4)" />
    <!-- Right Page -->
    <path d="M 126,92 C 118,90 110,88 102,94 L 102,108 C 110,102 118,104 126,106 Z" fill="url(#amberGold4)" />
    <!-- Center Spine & Silk Ribbon Bookmark (Dải lụa đánh dấu trang) -->
    <line x1="102" y1="94" x2="102" y2="108" stroke="#78350F" stroke-width="1.5" />
    <path d="M 102,108 L 102,118 L 105,115 L 108,118 L 108,108 Z" fill="#D97706" />

    <!-- LETTER A -->
    <path d="M 194,55 L 208,55 L 244,135 L 224,135 L 216,116 L 186,116 L 178,135 L 158,135 Z M 193,76 L 183,101 L 219,101 Z" />

    <!-- LETTER N -->
    <path d="M 264,55 L 282,55 L 322,113 L 322,55 L 340,55 L 340,135 L 322,135 L 282,77 L 282,135 L 264,135 Z" />

    <!-- LETTER Z -->
    <path d="M 362,55 L 434,55 L 434,72 L 388,118 L 434,118 L 434,135 L 362,135 L 362,118 L 408,72 L 362,72 Z" />

    <!-- LETTER I -->
    <path d="M 458,55 L 476,55 L 476,135 L 458,135 Z" />
    <!-- Graduation Cap / Wisdom Star atop I -->
    <path d="M 467,42 L 476,38 L 485,42 L 476,46 Z" fill="url(#amberGold4)" />
    <circle cx="485" cy="45" r="1.2" fill="#D97706" />
    <line x1="485" y1="45" x2="487" y2="50" stroke="#D97706" stroke-width="0.8" />
  </g>

  <!-- SUBTITLE & SLOGAN -->
  <text x="60" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="4.5" fill="#78716C">
    OPEN BOOKS &middot; EXPAND HORIZONS
  </text>
  <rect x="408" y="177" width="4" height="4" rx="1" fill="#D97706" />
  <text x="420" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D97706">
    GIÁO TRÌNH CHUẨN
  </text>
</svg>
