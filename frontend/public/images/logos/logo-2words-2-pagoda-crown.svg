<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGold2w2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cinnabarRed2w2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="softGlow2w2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="840" height="200" rx="16" fill="#FAFAF9" />
  <rect x="1.5" y="1.5" width="837" height="197" rx="14.5" fill="none" stroke="#E7E5E4" stroke-width="1.5" />

  <g id="twoWordsLogo" filter="url(#softGlow2w2)">
    
    <!-- WORD 1: "HANZI" WITH PAGODA ROOF 'A' -->
    <g id="wordHanzi" fill="#1C1917">
      <!-- H -->
      <path d="M 46,55 L 62,55 L 62,86 L 94,86 L 94,55 L 110,55 L 110,135 L 94,135 L 94,103 L 62,103 L 62,135 L 46,135 Z" />

      <!-- A : PAGODA ROOF (Mái đình uốn lượn phong cách Á Đông) -->
      <path d="M 172,42 C 184,44 200,51 210,56 C 213,53 216,49 218,48 C 215,56 208,62 201,64 C 189,60 179,53 172,51 C 165,53 155,60 143,64 C 136,62 129,56 126,48 C 128,49 131,53 134,56 C 144,51 160,44 172,42 Z" fill="url(#amberGold2w2)" />
      <path d="M 166,54 L 178,54 L 206,135 L 188,135 L 182,116 L 159,116 L 153,135 L 135,135 Z M 166,74 L 158,98 L 185,98 Z" />
      <circle cx="172" cy="107" r="3.2" fill="url(#cinnabarRed2w2)" />

      <!-- N -->
      <path d="M 226,55 L 242,55 L 278,114 L 278,55 L 294,55 L 294,135 L 278,135 L 242,76 L 242,135 L 226,135 Z" />

      <!-- Z -->
      <path d="M 314,55 L 378,55 L 378,71 L 337,118 L 378,118 L 378,135 L 314,135 L 314,118 L 355,71 L 314,71 Z" />

      <!-- I -->
      <path d="M 400,55 L 416,55 L 416,135 L 400,135 Z" />
    </g>

    <!-- SEAL STAMP: "汉字" TRADITIONAL CINNABAR STAMP (Triện son đỏ) -->
    <rect x="432" y="55" width="34" height="34" rx="6" fill="url(#cinnabarRed2w2)" />
    <text x="449" y="79" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      字
    </text>

    <!-- WORD 2: "MASTER" WITH CROWN MOTIF 'M' -->
    <g id="wordMaster" fill="url(#amberGold2w2)">
      <!-- M : STYLIZED CROWN (Vương miện 3 đỉnh cao tinh thông) -->
      <!-- 3 Small Gold Jewels atop Crown M -->
      <circle cx="496" cy="46" r="2.8" fill="url(#cinnabarRed2w2)" />
      <circle cx="523" cy="42" r="3.2" fill="url(#cinnabarRed2w2)" />
      <circle cx="550" cy="46" r="2.8" fill="url(#cinnabarRed2w2)" />
      <path d="M 488,55 L 506,55 L 523,98 L 540,55 L 558,55 L 558,135 L 544,135 L 544,80 L 528,118 L 518,118 L 502,80 L 502,135 L 488,135 Z" />

      <!-- A -->
      <path d="M 598,55 L 610,55 L 640,135 L 622,135 L 616,116 L 591,116 L 585,135 L 567,135 Z M 597,75 L 589,99 L 619,99 Z" />

      <!-- S -->
      <path d="M 686,72 C 681,61 671,55 658,55 C 645,55 637,62 637,71 C 637,81 644,86 658,90 C 676,94 686,100 686,113 C 686,126 675,135 660,135 C 645,135 635,127 630,116 L 643,109 C 646,116 652,121 660,121 C 667,121 672,117 672,112 C 672,106 667,103 653,98 C 637,93 624,87 624,73 C 624,61 635,42 658,42 C 669,42 678,47 683,55 Z" transform="translate(10, 5)" />

      <!-- T -->
      <path d="M 698,55 L 734,55 L 734,71 L 724,71 L 724,135 L 708,135 L 708,71 L 698,71 Z" />

      <!-- E -->
      <path d="M 744,55 L 778,55 L 778,71 L 760,71 L 760,86 L 774,86 L 774,102 L 760,102 L 760,119 L 779,119 L 779,135 L 744,135 Z" />

      <!-- R -->
      <path d="M 788,55 L 818,55 C 830,55 838,63 838,76 C 838,86 832,93 823,96 L 840,135 L 823,135 L 809,100 L 802,100 L 802,135 L 788,135 Z M 802,69 L 802,87 L 816,87 C 820,87 823,84 823,78 C 823,72 820,69 816,69 Z" />
    </g>
  </g>

  <!-- SUBTITLE & SLOGAN -->
  <text x="46" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#78716C">
    LỘ TRÌNH HSK 3.0 &middot; CHUẨN ĐẦU RA QUỐC TẾ
  </text>
  <rect x="424" y="169" width="4" height="4" rx="1" fill="#D97706" />
  <text x="436" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D97706">
    BECOME A MASTER
  </text>
</svg>
