<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGold2w3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow2w3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="840" height="200" rx="16" fill="#FAFAF9" />
  <rect x="1.5" y="1.5" width="837" height="197" rx="14.5" fill="none" stroke="#E7E5E4" stroke-width="1.5" />

  <g id="twoWordsLogo" filter="url(#softGlow2w3)">
    
    <!-- WORD 1: "HANZI" WITH PANDA MASCOT 'A' -->
    <g id="wordHanzi" fill="#1C1917">
      <!-- H -->
      <path d="M 46,55 L 62,55 L 62,86 L 94,86 L 94,55 L 110,55 L 110,135 L 94,135 L 94,103 L 62,103 L 62,135 L 46,135 Z" />

      <!-- A : CUTE PANDA MASCOT (Đôi tai tròn và mắt gấu trúc Panda AI) -->
      <circle cx="152" cy="48" r="8.5" fill="#1C1917" />
      <circle cx="190" cy="48" r="8.5" fill="#1C1917" />
      <circle cx="152" cy="48" r="4" fill="url(#amberGold2w3)" opacity="0.8" />
      <circle cx="190" cy="48" r="4" fill="url(#amberGold2w3)" opacity="0.8" />

      <path d="M 166,55 L 178,55 L 210,135 L 192,135 L 185,116 L 159,116 L 152,135 L 134,135 Z M 165,74 L 155,99 L 189,99 Z" />

      <!-- Eyes and nose in negative space -->
      <ellipse cx="166" cy="85" rx="3.2" ry="4.8" transform="rotate(-15 166 85)" fill="#1C1917" />
      <circle cx="165.5" cy="84" r="1.1" fill="#FFFFFF" />
      <ellipse cx="176" cy="85" rx="3.2" ry="4.8" transform="rotate(15 176 85)" fill="#1C1917" />
      <circle cx="175.5" cy="84" r="1.1" fill="#FFFFFF" />
      <path d="M 169.5,91.5 L 172.5,91.5 L 171,93 Z" fill="#1C1917" />

      <!-- N -->
      <path d="M 230,55 L 246,55 L 282,114 L 282,55 L 298,55 L 298,135 L 282,135 L 246,76 L 246,135 L 230,135 Z" />

      <!-- Z -->
      <path d="M 318,55 L 382,55 L 382,71 L 341,118 L 382,118 L 382,135 L 318,135 L 318,118 L 359,71 L 318,71 Z" />

      <!-- I with green bamboo sprout -->
      <path d="M 402,55 L 418,55 L 418,135 L 402,135 Z" />
      <path d="M 418,65 C 426,62 436,59 444,57 C 438,65 430,71 418,73 Z" fill="#10B981" />
    </g>

    <!-- WORD 2: "MASTER" WITH GRADUATION SCHOLAR CAP 'T' -->
    <g id="wordMaster" fill="url(#amberGold2w3)">
      <!-- M -->
      <path d="M 460,55 L 478,55 L 496,104 L 514,55 L 532,55 L 532,135 L 518,135 L 518,80 L 502,122 L 490,122 L 474,80 L 474,135 L 460,135 Z" />

      <!-- A -->
      <path d="M 572,55 L 584,55 L 614,135 L 596,135 L 590,116 L 565,116 L 559,135 L 541,135 Z M 571,75 L 563,99 L 593,99 Z" />

      <!-- S -->
      <path d="M 660,72 C 655,61 645,55 632,55 C 619,55 611,62 611,71 C 611,81 618,86 632,90 C 650,94 660,100 660,113 C 660,126 649,135 634,135 C 619,135 609,127 604,116 L 617,109 C 620,116 626,121 634,121 C 641,121 646,117 646,112 C 646,106 641,103 627,98 C 611,93 598,87 598,73 C 598,61 609,42 632,42 C 643,42 652,47 657,55 Z" transform="translate(10, 5)" />

      <!-- T : WITH GRADUATION CAP ATOP (Mũ cử nhân tốt nghiệp HSK) -->
      <path d="M 696,44 L 715,38 L 734,44 L 715,50 Z" fill="#1C1917" />
      <circle cx="734" cy="46" r="1.5" fill="#D97706" />
      <line x1="734" y1="46" x2="736" y2="52" stroke="#D97706" stroke-width="1.2" />
      <path d="M 672,55 L 712,55 L 712,71 L 702,71 L 702,135 L 686,135 L 686,71 L 672,71 Z" />

      <!-- E -->
      <path d="M 722,55 L 756,55 L 756,71 L 738,71 L 738,86 L 752,86 L 752,102 L 738,102 L 738,119 L 757,119 L 757,135 L 722,135 Z" />

      <!-- R -->
      <path d="M 766,55 L 796,55 C 808,55 816,63 816,76 C 816,86 810,93 801,96 L 818,135 L 801,135 L 787,100 L 780,100 L 780,135 L 766,135 Z M 780,69 L 780,87 L 794,87 C 798,87 801,84 801,78 C 801,72 798,69 794,69 Z" />
    </g>
  </g>

  <!-- SUBTITLE & SLOGAN -->
  <text x="46" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#78716C">
    HỌC TIẾNG TRUNG VỚI THẦY AI &middot; CHINH PHỤC HSK
  </text>
  <rect x="445" y="169" width="4" height="4" rx="1" fill="#D97706" />
  <text x="457" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D97706">
    VUI VẺ &middot; DỄ NHỚ
  </text>
</svg>
