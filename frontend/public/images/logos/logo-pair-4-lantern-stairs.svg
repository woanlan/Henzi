<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPair4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redLantern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="softGlowPair4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="860" height="210" rx="16" fill="#FAFAF9" />
  <rect x="1.5" y="1.5" width="857" height="207" rx="14.5" fill="none" stroke="#E7E5E4" stroke-width="1.5" />

  <g id="dualStylizedLogo" filter="url(#softGlowPair4)">
    
    <!-- WORD 1: HANZI (Stylized A: Traditional Lantern + Stylized I: Pinyin Tone Mark) -->
    <g id="wordHanzi" fill="#1C1917">
      <!-- H -->
      <path d="M 44,60 L 60,60 L 60,91 L 92,91 L 92,60 L 108,60 L 108,140 L 92,140 L 92,108 L 60,108 L 60,140 L 44,140 Z" />

      <!-- STYLIZED 1 IN HANZI -> A : TRADITIONAL CHINESE RED LANTERN (Đèn lồng đỏ may mắn) -->
      <path d="M 166,60 L 178,60 L 210,140 L 192,140 L 185,121 L 159,121 L 152,140 L 134,140 Z M 165,79 L 155,104 L 189,104 Z" />
      <!-- Lantern inside A -->
      <ellipse cx="172" cy="88" rx="6" ry="8" fill="url(#redLantern)" />
      <ellipse cx="172" cy="88" rx="2.5" ry="8" fill="none" stroke="#FEF08A" stroke-width="0.8" />
      <rect x="169" y="79" width="6" height="2" rx="0.5" fill="url(#goldPair4)" />
      <rect x="169" y="95" width="6" height="2" rx="0.5" fill="url(#goldPair4)" />
      <!-- Lantern Tassel -->
      <line x1="172" y1="97" x2="172" y2="103" stroke="url(#goldPair4)" stroke-width="1.2" />

      <!-- N -->
      <path d="M 226,60 L 242,60 L 278,119 L 278,60 L 294,60 L 294,140 L 278,140 L 242,81 L 242,140 L 226,140 Z" />

      <!-- Z -->
      <path d="M 314,60 L 378,60 L 378,76 L 337,123 L 378,123 L 378,140 L 314,140 L 314,123 L 355,76 L 314,76 Z" />

      <!-- STYLIZED 2 IN HANZI -> I : PINYIN ACCENT TONE (Dấu thanh điệu Pinyin chuẩn mực) -->
      <!-- Flat Tone Macron in Red/Gold -->
      <rect x="400" y="47" width="20" height="5" rx="2.5" fill="url(#redLantern)" />
      <path d="M 402,60 L 418,60 L 418,140 L 402,140 Z" />
    </g>

    <!-- WORD 2: MASTER (Stylized M: Oriental Folding Fan + Stylized E: 3-Step Staircase of Growth) -->
    <g id="wordMaster" fill="url(#goldPair4)">
      <!-- STYLIZED 1 IN MASTER -> M : ORIENTAL FOLDING FAN (Quạt xếp cổ trang phong nhã) -->
      <path d="M 464,60 L 482,60 L 499,104 L 516,60 L 534,60 L 534,140 L 520,140 L 520,85 L 504,123 L 494,123 L 478,85 L 478,140 L 464,140 Z" />
      <!-- Fan pleats arc behind top M -->
      <path d="M 482,56 C 492,48 506,48 516,56" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none" />
      <line x1="499" y1="104" x2="487" y2="54" stroke="#EF4444" stroke-width="1" opacity="0.6" />
      <line x1="499" y1="104" x2="499" y2="48" stroke="#EF4444" stroke-width="1" opacity="0.6" />
      <line x1="499" y1="104" x2="511" y2="54" stroke="#EF4444" stroke-width="1" opacity="0.6" />

      <!-- A -->
      <path d="M 574,60 L 586,60 L 616,140 L 598,140 L 592,121 L 567,121 L 561,140 L 543,140 Z M 573,80 L 565,104 L 595,104 Z" />

      <!-- S -->
      <path d="M 662,76 C 657,65 647,59 634,59 C 621,59 613,66 613,75 C 613,85 620,90 634,94 C 652,98 662,104 662,117 C 662,130 651,139 636,139 C 621,139 611,131 606,120 L 619,113 C 622,120 628,125 636,125 C 643,125 648,121 648,116 C 648,110 643,107 629,102 C 613,97 600,91 600,77 C 600,65 611,46 634,46 C 645,46 654,51 659,59 Z" transform="translate(10, 5)" />

      <!-- T -->
      <path d="M 686,60 L 722,60 L 722,76 L 712,76 L 712,140 L 696,140 L 696,76 L 686,76 Z" />

      <!-- STYLIZED 2 IN MASTER -> E : 3-STEP STAIRCASE OF HSK MASTERY (3 Bậc thang tiến bộ) -->
      <!-- Step 1: Top bar (HSK 6) -->
      <path d="M 736,60 L 778,60 L 778,76 L 752,76 L 752,89 L 770,89 L 770,103 L 752,103 L 752,125 L 784,125 L 784,140 L 736,140 Z" />
      <!-- Step markers -->
      <circle cx="784" cy="68" r="2.5" fill="#EF4444" />
      <circle cx="776" cy="96" r="2.5" fill="#F59E0B" />
      <circle cx="790" cy="132" r="2.5" fill="#10B981" />

      <!-- R -->
      <path d="M 798,60 L 826,60 C 838,60 844,68 844,81 C 844,91 838,98 830,101 L 846,140 L 830,140 L 817,105 L 810,105 L 810,140 L 798,140 Z M 810,74 L 810,92 L 824,92 C 828,92 831,89 831,83 C 831,77 828,74 824,74 Z" />
    </g>
  </g>

  <!-- SUBTITLE & SLOGAN -->
  <text x="44" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#78716C">
    2 ĐIỂM NHẤN HANZI (ĐÈN LỒNG &middot; THANH ĐIỆU) + 2 ĐIỂM NHẤN MASTER (QUẠT XẾP &middot; 3 BẬC THANG HSK)
  </text>
  <rect x="740" y="177" width="4" height="4" rx="1" fill="#D97706" />
  <text x="752" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#D97706">
    LỘ TRÌNH
  </text>
</svg>
